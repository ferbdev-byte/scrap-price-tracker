[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrap-price-tracker"
version = "0.1.0"
description = "Theo dõi giá phế liệu (sắt, đồng, nhôm, inox…) theo ngày: lưu SQLite, thống kê biến động, vẽ biểu đồ."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Võ Ngọc Cường" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
chart = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
scrapprice = "scrapprice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrapprice = ["*.ttf", "*.json"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
